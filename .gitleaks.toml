# JD2CV gitleaks configuration (owner, 2026-11-26).
# Uses all default rules, with one narrow exception: the generic-api-key rule matches the NEXT
# dictionary key name (for example disclaimer.5.body) after a UI string that ends with the word
# "key" (src/i18n/en.ts, "Your API key."). Dotted lowercase identifiers with three or more parts
# are names, not secrets. Any change to this file needs the code owner's review.
[extend]
useDefault = true

[allowlist]
description = "dotted lowercase identifiers such as i18n keys (generic-api-key false positive)"
regexTarget = "secret"
regexes = ['''^[a-z][a-z0-9]*(\.[a-z0-9-]+){2,}$''']
